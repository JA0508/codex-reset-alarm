<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Codex 额度闹钟</title>
<link rel="icon" href="data:,">
<style>
  :root { color-scheme:light dark; --bg:#f5f5f7; --surface:#fff; --ink:#1d1d1f; --muted:#6e6e73; --line:#e5e5e7; --blue:#0066cc; --green:#248a3d; --control:#f0f0f2; --error:#b42318; --error-bg:#fff0ee; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","PingFang SC",sans-serif; -webkit-font-smoothing:antialiased; }
  main { max-width:688px; margin:68px auto 40px; padding:0 24px; }
  header { display:flex; justify-content:space-between; align-items:center; gap:16px; margin:0 2px 22px; }
  h1 { margin:0; font-size:21px; font-weight:600; letter-spacing:-.02em; }
  .status { font-size:12px; color:var(--muted); line-height:1.6; text-align:right; }
  .panel { background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:0 28px; }
  .clock { padding:28px 0 20px; }
  .label { font-size:14px; font-weight:500; }
  #reset { font-size:14px; margin-top:9px; color:var(--muted); line-height:1.7; }
  .count { font-size:60px; font-weight:400; font-variant-numeric:tabular-nums; letter-spacing:-.03em; line-height:1.15; margin:23px 0 21px; }
  .clock-footer { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  #freshness { margin:0; font-size:12px; line-height:1.6; color:var(--muted); }
  .settings-row { border-top:1px solid var(--line); padding:21px 0; }
  .row-title { display:flex; align-items:center; justify-content:space-between; gap:18px; font-size:14px; }
  .credit { font-size:19px; font-weight:500; font-variant-numeric:tabular-nums; }
  .credit small { font-size:13px; font-weight:400; margin-left:5px; color:var(--muted); }
  .muted { font-size:12px; color:var(--muted); line-height:1.8; }
  .credit-meta { margin-top:8px; }
  #toggleHint { margin-top:6px; }
  .switchline { display:flex; align-items:center; justify-content:space-between; gap:24px; }
  #toggleLabel { font-size:14px; font-weight:500; }
  .switch { position:relative; border:0; width:44px; height:44px; padding:0; border-radius:8px; background:transparent; flex-shrink:0; }
  .switch::after { content:""; position:absolute; left:2px; top:9px; width:42px; height:26px; border-radius:20px; background:#b2b2b7; }
  .switch::before { content:""; position:absolute; z-index:1; left:5px; top:12px; width:20px; height:20px; background:#fff; border-radius:50%; transition:transform 180ms ease-out; }
  .switch[aria-checked="true"]::after { background:var(--green); }
  .switch[aria-checked="true"]::before { transform:translateX(16px); }
  button { font-family:inherit; font-size:13px; font-weight:400; cursor:pointer; border:0; border-radius:7px; padding:8px 11px; color:var(--blue); background:var(--control); max-width:100%; }
  button.text-button { padding:4px 0; background:transparent; }
  button:hover:not(:disabled) { filter:brightness(.95); }
  button:active:not(:disabled) { filter:brightness(.88); }
  button:disabled { opacity:.45; cursor:default; }
  button:focus-visible,a:focus-visible,input:focus-visible { outline:3px solid var(--blue); outline-offset:4px; }
  input { caret-color:var(--blue); }
  ::selection { background:#007aff30; }
  .controls { display:flex; justify-content:space-between; align-items:center; gap:20px; padding:16px 2px 0; }
  #soundHint { margin:12px 2px 0; font-size:11px; }
  #feedback { min-height:22px; margin:12px 2px 0; color:var(--muted); font-size:12px; line-height:1.8; }
  #demoNotice,#error { font-size:13px; line-height:1.7; border-radius:9px; padding:12px 14px; margin-bottom:16px; }
  #demoNotice { background:var(--control); color:var(--ink); border:1px solid var(--line); }
  #error { display:none; color:var(--error); background:var(--error-bg); }
  dialog { width:min(570px,calc(100% - 32px)); padding:24px; background:var(--surface); color:var(--ink); border:1px solid var(--line); border-radius:16px; }
  dialog::backdrop { background:#0005; }
  .dialog-header { display:flex; justify-content:space-between; align-items:center; gap:20px; margin-bottom:16px; }
  .dialog-header h2 { margin:0; font-size:18px; font-weight:600; }
  .connection-field { margin-top:16px; }
  .connection-field label { display:block; margin-bottom:7px; font-size:12px; color:var(--muted); }
  .connection-value { display:flex; gap:8px; }
  .connection-value input { min-width:0; width:100%; font-size:12px; padding:9px; background:var(--bg); color:var(--ink); border:1px solid var(--line); border-radius:7px; }
  .connection-value button { flex-shrink:0; }
  p,#reset,#feedback,#error,.status,.connection-field label { overflow-wrap:anywhere; }
  [hidden] { display:none!important; }
  @media(prefers-color-scheme:dark) { :root { --bg:#141414; --surface:#1c1c1e; --ink:#f5f5f7; --muted:#adadb3; --line:#38383b; --blue:#64b5ff; --green:#30a14e; --control:#2c2c2e; --error:#ffb4ab; --error-bg:#3a2424; } button:hover:not(:disabled) { filter:brightness(1.12); } }
  @media(max-width:600px) { body { background:var(--surface); } main { margin:32px auto 24px; padding:0 22px; } header { margin-bottom:14px; } .panel { padding:0; border:0; border-radius:0; } .clock { padding-top:24px; } .count { font-size:56px; } }
  @media(max-width:360px) { main { padding:0 18px; } h1 { font-size:19px; } header { gap:10px; } .count { font-size:48px; } .connection-value { flex-wrap:wrap; } .connection-value input { flex-basis:100%; } }
  @media(prefers-reduced-motion:reduce) { *,*::before,*::after { transition:none!important; animation:none!important; } }
</style>
</head>
<body>
<main>
<header><h1>Codex 额度闹钟</h1><span class="status" id="status">正在连接</span></header>
<div id="demoNotice" role="note" hidden>离线演示 · 模拟数据，不连接 Codex，不创建闹钟</div>
<div id="error" role="alert"></div>
<div class="panel">
  <section class="clock">
    <div class="label">下一次额度刷新</div>
    <div id="reset">等待读取刷新时间</div>
    <div class="count" id="count">--:--:--</div>
    <div class="clock-footer"><p id="freshness">最近读取：尚未获取数据</p><button class="text-button" id="refresh">刷新</button></div>
  </section>
  <section class="settings-row">
    <div class="row-title"><span>赠送重置次数</span><span class="credit"><span id="credits">—</span><small>次可用</small></span></div>
    <div class="credit-meta"><div class="muted">下次赠送时间：未知</div><div class="muted" id="expiry">暂无到期详情</div></div>
  </section>
  <section class="settings-row switchline">
    <div><div id="toggleLabel">闹钟提醒</div><div class="muted" id="toggleHint">正在读取提醒设置</div></div>
    <button class="switch" id="notifications" role="switch" aria-labelledby="toggleLabel" aria-checked="true" disabled></button>
  </section>
</div>
<div class="controls"><button class="text-button" id="test" disabled>试听电脑闹铃</button><span id="connectionTools" hidden><button class="text-button" id="connection">连接设置</button></span></div>
<p id="soundHint" class="muted">响铃最多 5 分钟，可在弹窗中停止。休眠后唤醒补提醒。</p>
<div id="feedback" role="status" aria-live="polite"></div>
</main>
<dialog id="connectionDialog" aria-labelledby="connectionTitle">
  <div class="dialog-header"><h2 id="connectionTitle">连接设置</h2><button class="text-button" id="closeConnection">关闭</button></div>
  <div id="connectionFeedback" class="muted" role="status" aria-live="polite"></div>
  <div id="connectionValues"></div>
  <p class="muted">专属地址可查看额度并修改提醒开关，请仅在可信 Wi-Fi 使用，勿分享。</p>
</dialog>
<script>
    const $ = id => document.getElementById(id);
    let data = null;
    let token = '';
    let saving = false;
    let statusController = null;
    let statusVersion = 0;
    let pollTimer = null;

    const stamp = timestamp => typeof timestamp === 'number' && timestamp > 0
      ? new Date(timestamp * 1000).toLocaleString('zh-CN', {hour12: false})
      : '暂无记录';

    async function request(path, options = {}, controller = new AbortController()) {
      const timeout = setTimeout(() => controller.abort(), 25000);
      try {
        const response = await fetch(path, {...options, signal: controller.signal});
        if (!response.ok) throw new Error('请求失败（' + response.status + '）');
        return await response.json();
      } finally {
        clearTimeout(timeout);
      }
    }

    function updateFreshness() {
      const fetched = data?.fetched_at;
      if (typeof fetched !== 'number' || !Number.isFinite(fetched) || fetched <= 0) {
        $('freshness').textContent = '最近读取：尚未成功获取实时额度';
        return;
      }
      const minutes = Math.floor(Math.max(0, Date.now() / 1000 - fetched) / 60);
      $('freshness').textContent = (data.demo_mode ? '演示数据生成：' : '最近读取：')
        + (minutes < 1 ? '刚刚' : minutes + ' 分钟前')
        + (data.demo_mode ? ' · 仅模拟展示' : '');
      $('freshness').title = '实时额度成功读取时间：' + stamp(fetched) + '；不是监测进程的检查时间';
    }

    function tick() {
      updateFreshness();
      if (!data?.reset) {
        $('count').textContent = '--:--:--';
        return;
      }
      const seconds = Math.max(0, Math.ceil(data.reset - Date.now() / 1000));
      $('count').textContent = seconds
        ? [Math.floor(seconds / 3600), Math.floor(seconds % 3600 / 60), seconds % 60]
          .map(value => String(value).padStart(2, '0')).join(':')
        : '已到刷新时间';
    }

    function renderStatus() {
      const credits = data.credits || {};
      token = data.csrf_token || '';
      const enabled = data.notifications_enabled !== false;
      $('notifications').setAttribute('aria-checked', String(enabled));
      $('notifications').disabled = saving || !token;
      $('demoNotice').hidden = !data.demo_mode;
      $('soundHint').hidden = !!data.demo_mode || !!data.phone_mode;
      document.querySelector('.controls').hidden = !!data.demo_mode || !!data.phone_mode;
      $('toggleHint').textContent = data.demo_mode
        ? (enabled ? '演示提醒已开启 · 仅修改内存中的模拟设置' : '演示提醒已暂停 · 模拟倒计时继续')
        : (enabled ? '到刷新时间时响铃提醒' : '提醒已暂停，额度继续更新');
      $('test').hidden = !!data.phone_mode || !!data.demo_mode;
      $('connectionTools').hidden = !!data.phone_mode || !!data.demo_mode;
      $('test').disabled = !token || !!data.test_alarm_active;
      $('status').classList.toggle('online', !!data.running);
      $('status').textContent = data.demo_mode ? '演示运行中' : (data.running ? '监测运行中' : '监测未运行 / 心跳过期');
      $('reset').textContent = data.reset
        ? '刷新时间 · ' + stamp(data.reset)
        : '暂未获得五小时刷新时间';
      $('credits').textContent = credits.availableCount ?? '—';
      const dates = (credits.credits || []).map(credit => credit.expiresAt).filter(Boolean);
      $('expiry').textContent = dates.length
        ? '最近到期 · ' + stamp(Math.min(...dates))
        : '接口暂未提供到期详情';
      $('error').style.display = data.error ? 'block' : 'none';
      $('error').textContent = data.error ? '实时读取失败：' + data.error + '。请稍后刷新。' : '';
      tick();
    }

    async function load() {
      if (saving || statusController) return;
      const controller = new AbortController();
      const version = ++statusVersion;
      statusController = controller;
      $('refresh').disabled = true;
      try {
        const result = await request('api/status', {cache: 'no-store'}, controller);
        if (version !== statusVersion || saving) return;
        data = result;
        renderStatus();
      } catch (error) {
        if (version !== statusVersion) return;
        $('error').style.display = 'block';
        $('error').textContent = '连接中断：'
          + (error.name === 'AbortError' ? '请求超过 25 秒，请稍后刷新。' : error.message)
          + (data ? ' 倒计时仍基于最近读取的数据。' : ' 请确认网页服务正在运行。');
        $('status').classList.remove('online');
        $('status').textContent = '连接中断';
        $('test').disabled = true;
        $('notifications').disabled = true;
      } finally {
        if (statusController === controller) statusController = null;
        if (!saving) $('refresh').disabled = false;
      }
    }

    $('notifications').onclick = async () => {
      if (saving || !token) return;
      const enabled = $('notifications').getAttribute('aria-checked') !== 'true';
      saving = true;
      statusVersion++;
      statusController?.abort();
      statusController = null;
      $('notifications').disabled = true;
      $('refresh').disabled = true;
      try {
        await request('api/settings', {
          method: 'POST',
          headers: {'Content-Type': 'application/json', 'X-CSRF-Token': token},
          body: JSON.stringify({enabled})
        });
        data = {...data, notifications_enabled: enabled};
        renderStatus();
        $('feedback').textContent = data.demo_mode
          ? (enabled ? '演示提醒已开启，仅本次演示有效，不会创建真实闹钟。' : '演示提醒已暂停，未修改任何真实提醒设置。')
          : (enabled ? '闹钟提醒已开启。' : '提醒已暂停，正在播放的电脑闹铃会停止，额度继续更新。已创建的 iPhone 闹钟需运行更新后的快捷指令关闭。');
      } catch (error) {
        $('feedback').textContent = error.name === 'AbortError'
          ? '保存请求超时，尚未确认结果。请刷新状态后再试。'
          : '未确认保存成功：' + error.message;
      } finally {
        saving = false;
        $('notifications').disabled = !token;
        $('refresh').disabled = false;
        await load();
      }
    };

    function addConnectionField(label, value) {
      if (typeof value !== 'string' || !value) return;
      const field = document.createElement('div');
      field.className = 'connection-field';
      const title = document.createElement('label');
      const input = document.createElement('input');
      input.id = 'connection-' + $('connectionValues').children.length;
      title.htmlFor = input.id;
      title.textContent = label;
      input.value = value;
      input.readOnly = true;
      input.addEventListener('click', () => input.select());
      const row = document.createElement('div');
      row.className = 'connection-value';
      const copy = document.createElement('button');
      copy.className = 'secondary';
      copy.textContent = '复制';
      copy.setAttribute('aria-label', '复制' + label);
      copy.onclick = async () => {
        try {
          if (!navigator.clipboard?.writeText) throw new Error('Clipboard unavailable');
          await navigator.clipboard.writeText(input.value);
          $('connectionFeedback').textContent = label + '已复制，请仅在自己的手机使用。';
        } catch (_) {
          input.focus();
          input.select();
          input.setSelectionRange(0, input.value.length);
          $('connectionFeedback').textContent = '无法自动复制，已选中地址，请使用系统复制操作。';
        }
      };
      row.append(input, copy);
      field.append(title, row);
      $('connectionValues').append(field);
    }

    $('connection').onclick = async () => {
      if (data?.demo_mode || data?.phone_mode) return;
      $('connectionDialog').showModal();
      $('connection').disabled = true;
      $('connectionFeedback').textContent = '正在检查手机桥接服务…';
      $('connectionValues').replaceChildren();
      try {
        const result = await request('api/connection', {cache: 'no-store'});
        if (!result.available) {
          $('connectionFeedback').textContent = result.action || '手机桥接暂不可用，请检查登录启动服务。';
          return;
        }
        addConnectionField('手机网页地址', result.hostname_url);
        addConnectionField('快捷指令数据地址', result.data_url);
        addConnectionField('IP 回退网页地址（主机名无法访问时）', result.ip_url);
        addConnectionField('IP 回退数据地址', result.ip_data_url);
        $('connectionFeedback').textContent = '手机需连接同一可信 Wi-Fi。主机名地址可保持固定，IP 回退地址可能变化。';
      } catch (error) {
        $('connectionFeedback').textContent = error.name === 'AbortError'
          ? '查询超时，请检查桥接服务后重试。'
          : '无法获取连接地址：' + error.message;
      } finally {
        $('connection').disabled = false;
      }
    };

    $('closeConnection').onclick = () => $('connectionDialog').close();
    $('connectionDialog').addEventListener('click', event => {
      if (event.target === $('connectionDialog')) {
        const bounds = $('connectionDialog').getBoundingClientRect();
        if (event.clientX < bounds.left || event.clientX > bounds.right || event.clientY < bounds.top || event.clientY > bounds.bottom) $('connectionDialog').close();
      }
    });

    $('refresh').onclick = load;
    $('test').onclick = async () => {
      if (data?.demo_mode || data?.phone_mode) return;
      $('test').disabled = true;
      try {
        await request('api/test-alarm', {
          method: 'POST',
          headers: {'Content-Type': 'application/json', 'X-CSRF-Token': token},
          body: '{}'
        });
        $('feedback').textContent = '电脑已开始试听，请在系统弹窗中点击“停止闹铃”。';
      } catch (error) {
        $('feedback').textContent = error.name === 'AbortError'
          ? '试听请求超时，请先确认电脑是否已响铃。'
          : error.message;
      } finally {
        setTimeout(() => { if (!document.hidden) load(); }, 1000);
      }
    };

    function updatePolling() {
      clearInterval(pollTimer);
      pollTimer = null;
      if (document.hidden) {
        statusVersion++;
        statusController?.abort();
        statusController = null;
      } else {
        load();
        pollTimer = setInterval(load, 15000);
      }
    }

    document.addEventListener('visibilitychange', updatePolling);
    updatePolling();
    setInterval(tick, 1000);
</script>
</body>
</html>
