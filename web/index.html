<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Codex 额度闹钟</title>
<link rel="icon" href="data:,">
<style>
  :root { color-scheme:light dark; --bg:#f6f8fb; --surface:#fff; --ink:#17243b; --muted:#65748a; --line:#e5eaf1; --accent:#4b56d6; --green:#087f72; --soft:#f0f2fb; --shadow:0 8px 32px #263b5b06; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif; -webkit-font-smoothing:antialiased; }
  main { max-width:1120px; margin:0 auto; padding:62px 36px 40px; }
  header { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:48px; }
  .identity { display:flex; align-items:center; gap:13px; }
  .brand-mark { width:36px; height:36px; border:1px solid var(--line); border-radius:12px; background:var(--surface); display:grid; place-items:center; color:var(--accent); }
  h1 { font-size:19px; font-weight:650; letter-spacing:-.4px; margin:0; }
  .brand-sub { color:var(--muted); font-size:11px; letter-spacing:1.5px; margin-top:4px; }
  .header-actions { display:flex; align-items:center; gap:16px; }
  .status { display:flex; align-items:center; gap:7px; color:var(--muted); font-size:12px; }
  .status::before { content:""; width:6px; height:6px; border-radius:50%; background:#9ba8ba; }
  .status.online::before { background:var(--green); box-shadow:0 0 0 4px #0a99800c; }
  .layout { display:grid; grid-template-columns:minmax(0,1.75fr) minmax(270px,1fr); gap:22px; align-items:stretch; }
  .clock,.side { min-width:0; background:var(--surface); border:1px solid var(--line); border-radius:24px; box-shadow:var(--shadow); }
  .clock { position:relative; padding:40px 36px 32px; overflow:hidden; display:flex; flex-direction:column; }
  .eyebrow { color:var(--muted); font-size:11px; letter-spacing:1.6px; font-weight:600; }
  .label { font-size:17px; font-weight:550; margin-top:10px; }
  .clock-art { position:absolute; right:24px; top:25px; width:92px; height:92px; color:var(--accent); opacity:.28; }
  .count { font-family:ui-monospace,"SFMono-Regular",Menlo,monospace; font-size:clamp(40px,5.8vw,72px); line-height:1.2; font-weight:400; letter-spacing:-3px; font-variant-numeric:tabular-nums; margin:64px 0 22px; }
  #reset { font-size:13px; color:var(--muted); line-height:1.6; }
  .clock-footer { border-top:1px solid var(--line); margin-top:33px; padding-top:20px; display:flex; flex-wrap:wrap; gap:10px; justify-content:space-between; align-items:center; }
  #freshness { margin:0; color:var(--muted); font-size:11px; line-height:1.8; }
  .paused-note { display:none; color:var(--muted); font-size:12px; margin-top:12px; }
  .clock.paused .paused-note { display:block; }
  .clock.paused .count { color:var(--muted); }
  .side { padding:30px 28px; display:flex; flex-direction:column; }
  .section-label { color:var(--muted); font-size:13px; }
  .credit { margin:22px 0 18px; font-size:52px; letter-spacing:-2px; font-weight:450; line-height:1; }
  .credit small { font-size:13px; letter-spacing:0; font-weight:400; color:var(--muted); margin-left:7px; }
  .muted { color:var(--muted); font-size:12px; line-height:1.9; }
  .credit-meta { margin-bottom:30px; }
  .switchline { border-top:1px solid var(--line); padding-top:27px; margin-top:auto; display:flex; justify-content:space-between; align-items:center; gap:18px; }
  #toggleLabel { font-size:14px; font-weight:550; }
  #toggleHint { margin-top:7px; max-width:210px; }
  button { font-family:inherit; border:1px solid transparent; border-radius:10px; padding:10px 14px; background:var(--accent); color:#fff; font-size:12px; font-weight:550; cursor:pointer; max-width:100%; }
  button.secondary { background:var(--soft); color:var(--ink); }
  button.text-button { background:transparent; color:var(--muted); padding:6px 0; }
  button:disabled { opacity:.45; cursor:default; }
  button:focus-visible,a:focus-visible,input:focus-visible { outline:3px solid var(--accent); outline-offset:4px; }
  .switch { padding:4px; border:0; width:42px; height:25px; background:#a5b0bf; border-radius:20px; flex-shrink:0; }
  .switch::before { content:""; display:block; width:17px; height:17px; background:#fff; border-radius:50%; transition:transform .15s; box-shadow:0 1px 3px #0002; }
  .switch[aria-checked="true"] { background:var(--accent); }
  .switch[aria-checked="true"]::before { transform:translateX(17px); }
  .controls { margin-top:22px; display:flex; justify-content:space-between; gap:20px; align-items:center; }
  .buttons { display:flex; gap:10px; flex-wrap:wrap; }
  #soundHint { margin:0; max-width:430px; font-size:11px; }
  #feedback { min-height:24px; color:var(--green); font-size:12px; line-height:1.8; margin:16px 0 0; }
  #demoNotice,#error { margin-bottom:20px; padding:13px 16px; border:1px solid var(--line); border-radius:12px; font-size:13px; line-height:1.8; }
  #demoNotice { color:var(--accent); background:var(--soft); }
  #error { display:none; color:#a0442e; background:#fff1ed; }
  dialog { width:min(620px,calc(100% - 32px)); padding:28px; border:1px solid var(--line); border-radius:20px; background:var(--surface); color:var(--ink); box-shadow:0 24px 100px #10203930; }
  dialog::backdrop { background:#13203955; backdrop-filter:blur(4px); }
  .dialog-header { display:flex; justify-content:space-between; align-items:center; gap:15px; margin-bottom:15px; }
  .dialog-header h2 { font-size:18px; margin:0; }
  .connection-field { margin-top:16px; }
  .connection-field label { display:block; font-size:12px; color:var(--muted); margin-bottom:7px; }
  .connection-value { display:flex; gap:8px; }
  .connection-value input { width:100%; min-width:0; border:1px solid var(--line); border-radius:9px; padding:10px; background:var(--bg); color:var(--ink); font-size:12px; }
  .connection-value button { flex-shrink:0; }
  p,#reset,#feedback,#error,.status,.connection-field label { overflow-wrap:anywhere; }
  [hidden] { display:none!important; }
  @media(prefers-color-scheme:dark) { :root { --bg:#101722; --surface:#182230; --ink:#e6edf7; --muted:#a5b3c7; --line:#2b384b; --accent:#a3aaff; --green:#6ad3be; --soft:#263249; --shadow:0 10px 35px #00000012; } button:not(.secondary):not(.text-button):not(.switch) { color:#17213a; } #error { background:#3d2a28; color:#ffbda8; } .switch[aria-checked="true"] { background:#727edc; } }
  @media(max-width:760px) { main { padding:30px 22px; } header { margin-bottom:28px; } .layout { grid-template-columns:1fr; } .clock { padding:30px; } .count { margin-top:55px; font-size:64px; } .side { padding:27px; } .credit { font-size:44px; } .credit-meta { margin-bottom:22px; } .controls { align-items:flex-start; flex-direction:column; gap:14px; } .header-actions { gap:12px; } }
  @media(max-width:400px) { main { padding:24px 16px; } header { gap:12px; flex-wrap:wrap; } .clock { padding:25px 22px; } .clock-art { width:74px; height:74px; right:19px; } .count { font-size:47px; letter-spacing:-2px; margin-top:55px; } .label { font-size:15px; } .connection-value { flex-wrap:wrap; } .connection-value input { flex-basis:100%; } }
  @media(prefers-reduced-motion:reduce) { *,*::before,*::after { transition:none!important; animation:none!important; } }
</style>
</head>
<body>
<main>
<header>
  <div class="identity">
    <span class="brand-mark" aria-hidden="true"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/></svg></span>
    <div><h1>Codex 额度闹钟</h1><div class="brand-sub">RESET ALARM</div></div>
  </div>
  <div class="header-actions"><span class="status" id="status">正在连接</span><span id="connectionTools" hidden><button class="text-button" id="connection">连接设置</button></span></div>
</header>
<div id="demoNotice" role="note" hidden>离线演示 · 模拟数据，不连接 Codex，不创建闹钟</div>
<div id="error" role="alert"></div>
<div class="layout">
  <section class="clock">
    <svg class="clock-art" viewBox="0 0 100 100" fill="none" aria-hidden="true"><circle cx="50" cy="50" r="41" stroke="currentColor" stroke-width="1"/><circle cx="50" cy="50" r="34" stroke="currentColor" stroke-width="5" stroke-dasharray="1 16.8"/><path d="M50 26v24l17 10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="50" cy="50" r="2.5" fill="currentColor"/></svg>
    <div class="eyebrow">NEXT RESET</div>
    <div class="label">距离下一次额度刷新</div>
    <div class="count" id="count">--:--:--</div>
    <div id="reset">等待读取刷新时间</div>
    <div class="paused-note">提醒已暂停 · 倒计时继续更新</div>
    <div class="clock-footer"><p id="freshness">最近读取：尚未获取数据</p><button class="text-button" id="refresh">刷新状态 ↻</button></div>
  </section>
  <section class="side">
    <div class="section-label">赠送重置次数</div>
    <div class="credit"><span id="credits">—</span><small>次可用</small></div>
    <div class="credit-meta"><div class="muted">下次赠送时间：未知</div><div class="muted" id="expiry">暂无到期详情</div></div>
    <div class="switchline"><div><div id="toggleLabel">闹钟提醒</div><div class="muted" id="toggleHint">正在读取提醒设置</div></div><button class="switch" id="notifications" role="switch" aria-labelledby="toggleLabel" aria-checked="true" disabled></button></div>
  </section>
</div>
<div class="controls"><div class="buttons"><button class="secondary" id="test" disabled>试听电脑闹铃</button></div><p id="soundHint" class="muted">到时持续响铃，点击弹窗停止，最多 5 分钟。休眠后唤醒补提醒。</p></div>
<div id="feedback" role="status" aria-live="polite"></div>
</main>
<dialog id="connectionDialog" aria-labelledby="connectionTitle">
  <div class="dialog-header"><h2 id="connectionTitle">连接设置</h2><button class="text-button" id="closeConnection" aria-label="关闭连接设置">关闭 ✕</button></div>
  <div id="connectionFeedback" class="muted" role="status" aria-live="polite"></div>
  <div id="connectionValues"></div>
  <p class="muted">专属地址可查看额度并修改提醒开关，请仅在可信 Wi-Fi 使用，勿分享。</p>
</dialog>
<script>
    const $ = id => document.getElementById(id);
    let data = null;
    let token = '';
    let saving = false;
    let statusController = null;
    let statusVersion = 0;
    let pollTimer = null;

    const stamp = timestamp => typeof timestamp === 'number' && timestamp > 0
      ? new Date(timestamp * 1000).toLocaleString('zh-CN', {hour12: false})
      : '暂无记录';

    async function request(path, options = {}, controller = new AbortController()) {
      const timeout = setTimeout(() => controller.abort(), 25000);
      try {
        const response = await fetch(path, {...options, signal: controller.signal});
        if (!response.ok) throw new Error('请求失败（' + response.status + '）');
        return await response.json();
      } finally {
        clearTimeout(timeout);
      }
    }

    function updateFreshness() {
      const fetched = data?.fetched_at;
      if (typeof fetched !== 'number' || !Number.isFinite(fetched) || fetched <= 0) {
        $('freshness').textContent = '最近读取：尚未成功获取实时额度';
        return;
      }
      const minutes = Math.floor(Math.max(0, Date.now() / 1000 - fetched) / 60);
      $('freshness').textContent = (data.demo_mode ? '演示数据生成：' : '最近读取：')
        + (minutes < 1 ? '刚刚' : minutes + ' 分钟前')
        + (data.demo_mode ? ' · 仅模拟展示' : '');
      $('freshness').title = '实时额度成功读取时间：' + stamp(fetched) + '；不是监测进程的检查时间';
    }

    function tick() {
      updateFreshness();
      if (!data?.reset) {
        $('count').textContent = '--:--:--';
        return;
      }
      const seconds = Math.max(0, Math.ceil(data.reset - Date.now() / 1000));
      $('count').textContent = seconds
        ? [Math.floor(seconds / 3600), Math.floor(seconds % 3600 / 60), seconds % 60]
          .map(value => String(value).padStart(2, '0')).join(':')
        : '已到刷新时间';
    }

    function renderStatus() {
      const credits = data.credits || {};
      token = data.csrf_token || '';
      const enabled = data.notifications_enabled !== false;
      document.querySelector('.clock').classList.toggle('paused', !enabled);
      $('notifications').setAttribute('aria-checked', String(enabled));
      $('notifications').disabled = saving || !token;
      $('demoNotice').hidden = !data.demo_mode;
      $('soundHint').hidden = !!data.demo_mode || !!data.phone_mode;
      document.querySelector('.controls').hidden = !!data.demo_mode || !!data.phone_mode;
      $('toggleHint').textContent = data.demo_mode
        ? (enabled ? '演示提醒已开启 · 仅修改内存中的模拟设置' : '演示提醒已暂停 · 模拟倒计时继续')
        : (enabled ? '到刷新时间时响铃提醒' : '提醒已暂停，额度继续更新');
      $('test').hidden = !!data.phone_mode || !!data.demo_mode;
      $('connectionTools').hidden = !!data.phone_mode || !!data.demo_mode;
      $('test').disabled = !token || !!data.test_alarm_active;
      $('status').classList.toggle('online', !!data.running);
      $('status').textContent = data.demo_mode ? '演示运行中' : (data.running ? '监测运行中' : '监测未运行 / 心跳过期');
      $('reset').textContent = data.reset
        ? '刷新时间 · ' + stamp(data.reset)
        : '暂未获得五小时刷新时间';
      $('credits').textContent = credits.availableCount ?? '—';
      const dates = (credits.credits || []).map(credit => credit.expiresAt).filter(Boolean);
      $('expiry').textContent = dates.length
        ? '最近到期 · ' + stamp(Math.min(...dates))
        : '接口暂未提供到期详情';
      $('error').style.display = data.error ? 'block' : 'none';
      $('error').textContent = data.error ? '实时读取失败：' + data.error + '。请稍后刷新。' : '';
      tick();
    }

    async function load() {
      if (saving || statusController) return;
      const controller = new AbortController();
      const version = ++statusVersion;
      statusController = controller;
      $('refresh').disabled = true;
      try {
        const result = await request('api/status', {cache: 'no-store'}, controller);
        if (version !== statusVersion || saving) return;
        data = result;
        renderStatus();
      } catch (error) {
        if (version !== statusVersion) return;
        $('error').style.display = 'block';
        $('error').textContent = '连接中断：'
          + (error.name === 'AbortError' ? '请求超过 25 秒，请稍后刷新。' : error.message)
          + (data ? ' 倒计时仍基于最近读取的数据。' : ' 请确认网页服务正在运行。');
        $('status').classList.remove('online');
        $('status').textContent = '连接中断';
        $('test').disabled = true;
        $('notifications').disabled = true;
      } finally {
        if (statusController === controller) statusController = null;
        if (!saving) $('refresh').disabled = false;
      }
    }

    $('notifications').onclick = async () => {
      if (saving || !token) return;
      const enabled = $('notifications').getAttribute('aria-checked') !== 'true';
      saving = true;
      statusVersion++;
      statusController?.abort();
      statusController = null;
      $('notifications').disabled = true;
      $('refresh').disabled = true;
      try {
        await request('api/settings', {
          method: 'POST',
          headers: {'Content-Type': 'application/json', 'X-CSRF-Token': token},
          body: JSON.stringify({enabled})
        });
        data = {...data, notifications_enabled: enabled};
        renderStatus();
        $('feedback').textContent = data.demo_mode
          ? (enabled ? '演示提醒已开启，仅本次演示有效，不会创建真实闹钟。' : '演示提醒已暂停，未修改任何真实提醒设置。')
          : (enabled ? '闹钟提醒已开启。' : '提醒已暂停，正在播放的电脑闹铃会停止，额度继续更新。已创建的 iPhone 闹钟需运行更新后的快捷指令关闭。');
      } catch (error) {
        $('feedback').textContent = error.name === 'AbortError'
          ? '保存请求超时，尚未确认结果。请刷新状态后再试。'
          : '未确认保存成功：' + error.message;
      } finally {
        saving = false;
        $('notifications').disabled = !token;
        $('refresh').disabled = false;
        await load();
      }
    };

    function addConnectionField(label, value) {
      if (typeof value !== 'string' || !value) return;
      const field = document.createElement('div');
      field.className = 'connection-field';
      const title = document.createElement('label');
      const input = document.createElement('input');
      input.id = 'connection-' + $('connectionValues').children.length;
      title.htmlFor = input.id;
      title.textContent = label;
      input.value = value;
      input.readOnly = true;
      input.addEventListener('click', () => input.select());
      const row = document.createElement('div');
      row.className = 'connection-value';
      const copy = document.createElement('button');
      copy.className = 'secondary';
      copy.textContent = '复制';
      copy.setAttribute('aria-label', '复制' + label);
      copy.onclick = async () => {
        try {
          if (!navigator.clipboard?.writeText) throw new Error('Clipboard unavailable');
          await navigator.clipboard.writeText(input.value);
          $('connectionFeedback').textContent = label + '已复制，请仅在自己的手机使用。';
        } catch (_) {
          input.focus();
          input.select();
          input.setSelectionRange(0, input.value.length);
          $('connectionFeedback').textContent = '无法自动复制，已选中地址，请使用系统复制操作。';
        }
      };
      row.append(input, copy);
      field.append(title, row);
      $('connectionValues').append(field);
    }

    $('connection').onclick = async () => {
      if (data?.demo_mode || data?.phone_mode) return;
      $('connectionDialog').showModal();
      $('connection').disabled = true;
      $('connectionFeedback').textContent = '正在检查手机桥接服务…';
      $('connectionValues').replaceChildren();
      try {
        const result = await request('api/connection', {cache: 'no-store'});
        if (!result.available) {
          $('connectionFeedback').textContent = result.action || '手机桥接暂不可用，请检查登录启动服务。';
          return;
        }
        addConnectionField('手机网页地址', result.hostname_url);
        addConnectionField('快捷指令数据地址', result.data_url);
        addConnectionField('IP 回退网页地址（主机名无法访问时）', result.ip_url);
        addConnectionField('IP 回退数据地址', result.ip_data_url);
        $('connectionFeedback').textContent = '手机需连接同一可信 Wi-Fi。主机名地址可保持固定，IP 回退地址可能变化。';
      } catch (error) {
        $('connectionFeedback').textContent = error.name === 'AbortError'
          ? '查询超时，请检查桥接服务后重试。'
          : '无法获取连接地址：' + error.message;
      } finally {
        $('connection').disabled = false;
      }
    };

    $('closeConnection').onclick = () => $('connectionDialog').close();
    $('connectionDialog').addEventListener('click', event => {
      if (event.target === $('connectionDialog')) {
        const bounds = $('connectionDialog').getBoundingClientRect();
        if (event.clientX < bounds.left || event.clientX > bounds.right || event.clientY < bounds.top || event.clientY > bounds.bottom) $('connectionDialog').close();
      }
    });

    $('refresh').onclick = load;
    $('test').onclick = async () => {
      if (data?.demo_mode || data?.phone_mode) return;
      $('test').disabled = true;
      try {
        await request('api/test-alarm', {
          method: 'POST',
          headers: {'Content-Type': 'application/json', 'X-CSRF-Token': token},
          body: '{}'
        });
        $('feedback').textContent = '电脑已开始试听，请在系统弹窗中点击“停止闹铃”。';
      } catch (error) {
        $('feedback').textContent = error.name === 'AbortError'
          ? '试听请求超时，请先确认电脑是否已响铃。'
          : error.message;
      } finally {
        setTimeout(() => { if (!document.hidden) load(); }, 1000);
      }
    };

    function updatePolling() {
      clearInterval(pollTimer);
      pollTimer = null;
      if (document.hidden) {
        statusVersion++;
        statusController?.abort();
        statusController = null;
      } else {
        load();
        pollTimer = setInterval(load, 15000);
      }
    }

    document.addEventListener('visibilitychange', updatePolling);
    updatePolling();
    setInterval(tick, 1000);
</script>
</body>
</html>
